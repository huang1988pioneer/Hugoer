name: Android mobile release

on:
  push:
    tags:
      - "mobile-v*"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-mobile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test and package Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build optimized unsigned APK
        run: bash ./gradlew --no-daemon test assembleRelease

      - name: Stage optimized unsigned APK
        working-directory: .
        run: |
          release_name="${GITHUB_REF_NAME//\//-}"
          mkdir -p artifacts/android
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/android/HugoerMobile-${release_name}-unsigned.apk

      - name: Build installable preview APK
        run: bash ./gradlew --no-daemon assembleRelease -PpreviewSigning=true

      - name: Stage installable preview APK
        working-directory: .
        run: |
          release_name="${GITHUB_REF_NAME//\//-}"
          mkdir -p artifacts/android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/android/HugoerMobile-${release_name}-preview-signed.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HugoerMobile-${{ github.run_id }}-apk
          if-no-files-found: error
          path: artifacts/android/*.apk

  release:
    name: Publish Android release
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged APKs
        uses: actions/download-artifact@v4
        with:
          name: HugoerMobile-${{ github.run_id }}-apk
          path: artifacts/android

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hugoer Mobile ${{ github.ref_name }}
          body: |
            ## APKs

            - `*-preview-signed.apk` is optimized and installable, signed with the Android debug key solely for device QA. It is **not** for Play Store submission.
            - `*-unsigned.apk` is optimized and must be signed with the production upload key before distribution.

            The release runs the Android unit tests before packaging both assets.
          files: artifacts/android/*.apk
