<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https: http: file: blob:; media-src data: https: http: file: blob:;"/>
  <title>Hugoer Quill</title>
  <style>
    /*__QUILL_CSS__*/
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0d1218;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    }
    #editor.ql-container {
      height: 100%;
      border: 0;
      font-family: inherit;
      font-size: 16.5px;
    }
    .ql-editor {
      box-sizing: border-box;
      min-height: 100%;
      height: auto;
      padding: 28px 36px 96px;
      max-width: 860px;
      margin: 0 auto;
      overflow-y: auto;
      font-size: 16.5px;
      line-height: 1.7;
      caret-color: #7cdaf9;
      color: #e6edf3;
    }
    .ql-editor.ql-blank::before {
      color: #6b7785;
      font-style: italic;
      left: 36px;
      right: 36px;
    }
    .ql-editor h1, .ql-editor h2, .ql-editor h3, .ql-editor h4, .ql-editor h5, .ql-editor h6 {
      color: #7cdaf9;
      margin: 1.25em 0 0.45em;
      font-weight: 650;
      line-height: 1.3;
    }
    .ql-editor h1 { font-size: 2em; border-bottom: 1px solid #2a3648; padding-bottom: 0.2em; }
    .ql-editor h2 { font-size: 1.55em; border-bottom: 1px solid #243041; padding-bottom: 0.15em; }
    .ql-editor h3 { font-size: 1.28em; }
    .ql-editor p { margin: 0.7em 0; }
    .ql-editor a { color: #5ec8f0; text-decoration: none; }
    .ql-editor a:hover { text-decoration: underline; }
    .ql-editor code {
      font-family: Consolas, "Cascadia Mono", monospace;
      background: #1a2330;
      padding: 0.12em 0.38em;
      border-radius: 4px;
      font-size: 0.92em;
    }
    .ql-editor .ql-code-block-container,
    .ql-editor pre {
      background: #121a24;
      border: 1px solid #2a3648;
      border-radius: 8px;
      padding: 12px 14px;
      margin: 1em 0;
      overflow: auto;
      white-space: pre-wrap;
      font-family: Consolas, "Cascadia Mono", monospace;
    }
    .ql-editor .ql-code-block { margin: 0; }
    .ql-editor pre code { background: transparent; padding: 0; }
    .ql-editor blockquote {
      margin: 1em 0;
      padding: 0.35em 1em;
      border-left: 2px solid #0e7490;
      background: #151c26;
      color: #c5d0dc;
    }
    .ql-editor table { border-collapse: collapse; width: 100%; margin: 1em 0; table-layout: auto; }
    .ql-editor th, .ql-editor td { border: 1px solid #2a3648; padding: 8px 10px; min-width: 4em; }
    .ql-editor th { background: #1a2330; }
    .ql-editor img { max-width: 100%; height: auto; border-radius: 6px; cursor: pointer; }
    .ql-editor img.hugoer-img-selected { outline: 2px solid #7cdaf9; outline-offset: 3px; cursor: grab; }
    .ql-editor img.hugoer-img-moving { opacity: 0.38; cursor: grabbing; }
    .ql-editor audio, .ql-editor video { width: 100%; max-width: 640px; margin: 1em 0; display: block; }
    .ql-editor .hugoer-raw { margin: 0.8em 0; }
    .ql-editor .hugoer-raw-body[contenteditable="true"] { outline: none; cursor: text; }
    .ql-editor hr { border: none; border-top: 1px solid #2a3648; margin: 1.5em 0; }
    .ql-editor ul, .ql-editor ol { padding-left: 1.45em; }
    .ql-editor li { margin: 0.2em 0; }
    .ql-editor strong { color: #fff; }
    .ql-editor li[data-list=checked] > .ql-ui,
    .ql-editor li[data-list=unchecked] > .ql-ui { color: #7cdaf9; }
    #imgChrome {
      position: fixed;
      display: none;
      z-index: 18;
      box-sizing: content-box;
      border: 2px solid #7cdaf9;
      border-radius: 8px;
      pointer-events: none;
    }
    #imgChrome.open { display: block; }
    #imgChrome.moving { opacity: 0; }
    #imgMoveHit {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      cursor: grab;
    }
    #imgDrop {
      position: fixed;
      display: none;
      height: 3px;
      background: #7cdaf9;
      border-radius: 99px;
      box-shadow: 0 0 0 1px rgba(13, 18, 24, 0.35);
      z-index: 19;
      pointer-events: none;
    }
    #imgDrop.open { display: block; }
    #imgToolbar {
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
      background: #151c26;
      border: 1px solid #2a3648;
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.38);
      pointer-events: auto;
      white-space: nowrap;
      z-index: 3;
    }
    #imgChrome.toolbar-below #imgToolbar { bottom: auto; top: calc(100% + 8px); }
    #imgChrome.toolbar-end #imgToolbar { left: auto; right: 0; }
    #imgToolbar button {
      background: #1c2736;
      color: #d7e0ea;
      border: 0;
      border-radius: 7px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
    }
    #imgToolbar button:hover { background: #243140; }
    #imgToolbar button.on { background: #0e7490; color: #fff; }
    #imgToolbar .sep { width: 1px; height: 16px; background: #2a3648; margin: 0 2px; }
    #imgSize { color: #9aa8b8; font-size: 11px; padding: 0 6px 0 4px; min-width: 3.5em; }
    .img-handle {
      position: absolute;
      width: 11px;
      height: 11px;
      background: #7cdaf9;
      border: 2px solid #0d1218;
      border-radius: 3px;
      pointer-events: auto;
      box-sizing: border-box;
      touch-action: none;
      z-index: 2;
    }
    .img-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
    .img-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
    .img-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .img-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
    #mask {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7, 10, 14, 0.55);
      align-items: center; justify-content: center;
      z-index: 20;
    }
    #mask.open { display: flex; }
    #dialog {
      width: min(420px, calc(100% - 32px));
      background: #151c26;
      border: 1px solid #2a3648;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    #dialog h2 { margin: 0 0 12px; font-size: 15px; color: #7cdaf9; border: 0; }
    #dialog label { display: block; font-size: 12px; color: #9aa8b8; margin: 8px 0 4px; }
    #dialog input {
      width: 100%; box-sizing: border-box;
      background: #0d1218; color: #e6edf3;
      border: 1px solid #2a3648; border-radius: 8px;
      padding: 8px 10px; font-size: 14px;
    }
    #dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #dialog button {
      background: #1c2736; color: #d7e0ea; border: 0;
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600;
    }
    #dialog button.primary { background: #0e7490; color: #fff; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div id="imgChrome">
    <div id="imgToolbar">
      <button type="button" data-move="-1" title="上移">上</button>
      <button type="button" data-move="1" title="下移">下</button>
      <span class="sep"></span>
      <button type="button" data-align="left" title="靠左">左</button>
      <button type="button" data-align="center" title="置中">中</button>
      <button type="button" data-align="right" title="靠右">右</button>
      <span class="sep"></span>
      <button type="button" data-align="wrap-left" title="文字從右側環繞">繞左</button>
      <button type="button" data-align="wrap-right" title="文字從左側環繞">繞右</button>
      <span class="sep"></span>
      <button type="button" id="imgReset" title="恢復原始大小與預設排版">原始</button>
      <span id="imgSize"></span>
    </div>
    <div id="imgMoveHit" title="拖曳移動位置"></div>
    <span class="img-handle nw" data-handle="nw"></span>
    <span class="img-handle ne" data-handle="ne"></span>
    <span class="img-handle sw" data-handle="sw"></span>
    <span class="img-handle se" data-handle="se"></span>
  </div>
  <div id="imgDrop"></div>
  <div id="mask">
    <div id="dialog">
      <h2 id="dlgTitle">插入連結</h2>
      <label id="dlgTextLabel" for="dlgText">顯示文字</label>
      <input id="dlgText" type="text"/>
      <label id="dlgHrefLabel" for="dlgHref">網址</label>
      <input id="dlgHref" type="text"/>
      <div class="actions">
        <button type="button" id="dlgCancel">取消</button>
        <button type="button" class="primary" id="dlgOk">確定</button>
      </div>
    </div>
  </div>
  <script>
    /*__QUILL_JS__*/
  </script>
  <script>
    /*__HUGOER_EDITOR_JS__*/
    HugoerQuill.mount(document);
  </script>
</body>
</html>
