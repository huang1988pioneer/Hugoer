<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https: http: file: blob:; media-src data: https: http: file: blob:;"/>
  <title>Hugoer WYSIWYG</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0d1218;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    }
    #editor {
      box-sizing: border-box;
      min-height: 100%;
      padding: 28px 36px 96px;
      max-width: 860px;
      margin: 0 auto;
      outline: none;
      font-size: 16.5px;
      line-height: 1.7;
      caret-color: #7cdaf9;
    }
    #editor.is-empty::before {
      content: attr(data-placeholder);
      color: #6b7785;
      font-style: italic;
      pointer-events: none;
      float: left;
      height: 0;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #7cdaf9;
      margin: 1.25em 0 0.45em;
      font-weight: 650;
      line-height: 1.3;
    }
    h1 { font-size: 2em; border-bottom: 1px solid #2a3648; padding-bottom: 0.2em; }
    h2 { font-size: 1.55em; border-bottom: 1px solid #243041; padding-bottom: 0.15em; }
    h3 { font-size: 1.28em; }
    p { margin: 0.7em 0; }
    a { color: #5ec8f0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-family: Consolas, "Cascadia Mono", monospace;
      background: #1a2330;
      padding: 0.12em 0.38em;
      border-radius: 4px;
      font-size: 0.92em;
    }
    pre {
      background: #121a24;
      border: 1px solid #2a3648;
      border-radius: 8px;
      padding: 12px 14px;
      overflow: auto;
      white-space: pre-wrap;
    }
    pre code { background: transparent; padding: 0; }
    blockquote {
      margin: 1em 0;
      padding: 0.35em 1em;
      border-left: 4px solid #0e7490;
      background: #151c26;
      color: #c5d0dc;
    }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { border: 1px solid #2a3648; padding: 8px 10px; min-width: 4em; }
    th { background: #1a2330; }
    img { max-width: 100%; border-radius: 6px; }
    audio, video { width: 100%; max-width: 640px; margin: 1em 0; display: block; }
    hr { border: none; border-top: 1px solid #2a3648; margin: 1.5em 0; }
    ul, ol { padding-left: 1.45em; }
    li { margin: 0.2em 0; }
    li > input[type="checkbox"] { margin-right: 0.45em; }
    strong { color: #fff; }
    #mask {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7, 10, 14, 0.55);
      align-items: center; justify-content: center;
      z-index: 20;
    }
    #mask.open { display: flex; }
    #dialog {
      width: min(420px, calc(100% - 32px));
      background: #151c26;
      border: 1px solid #2a3648;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    #dialog h2 { margin: 0 0 12px; font-size: 15px; color: #7cdaf9; border: 0; }
    #dialog label { display: block; font-size: 12px; color: #9aa8b8; margin: 8px 0 4px; }
    #dialog input {
      width: 100%; box-sizing: border-box;
      background: #0d1218; color: #e6edf3;
      border: 1px solid #2a3648; border-radius: 8px;
      padding: 8px 10px; font-size: 14px;
    }
    #dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #dialog button {
      background: #1c2736; color: #d7e0ea; border: 0;
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600;
    }
    #dialog button.primary { background: #0e7490; color: #fff; }
  </style>
</head>
<body>
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="開始撰寫文章…"></div>
  <div id="mask">
    <div id="dialog">
      <h2 id="dlgTitle">插入連結</h2>
      <label id="dlgTextLabel" for="dlgText">顯示文字</label>
      <input id="dlgText" type="text"/>
      <label id="dlgHrefLabel" for="dlgHref">網址</label>
      <input id="dlgHref" type="text"/>
      <div class="actions">
        <button type="button" id="dlgCancel">取消</button>
        <button type="button" class="primary" id="dlgOk">確定</button>
      </div>
    </div>
  </div>
  <script>
    const editor = document.getElementById('editor');
    const mask = document.getElementById('mask');
    let suppress = false;
    let changeTimer = 0;
    let dialogKind = 'link';
    let savedRange = null;

    document.execCommand('defaultParagraphSeparator', false, 'p');

    function post(payload) {
      if (typeof invokeCSharpAction === 'function') {
        invokeCSharpAction(JSON.stringify(payload));
      }
    }

    function isEmpty() {
      const text = (editor.innerText || '').replace(/\u200B/g, '').trim();
      return text.length === 0;
    }

    function updatePlaceholder() {
      editor.classList.toggle('is-empty', isEmpty());
    }

    function currentBlock() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return null;
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentElement;
      while (node && node !== editor) {
        const tag = node.tagName;
        if (tag && /^(P|DIV|H1|H2|H3|H4|H5|H6|LI|BLOCKQUOTE|PRE)$/.test(tag))
          return node;
        node = node.parentElement;
      }
      return editor;
    }

    function textBeforeCaret(block) {
      const sel = window.getSelection();
      if (!sel.rangeCount || !block) return '';
      const range = sel.getRangeAt(0);
      const pre = document.createRange();
      try {
        pre.selectNodeContents(block);
        pre.setEnd(range.startContainer, range.startOffset);
        return pre.toString();
      } catch {
        return '';
      }
    }

    function clearPrefix(block, count) {
      const sel = window.getSelection();
      if (!sel.rangeCount || !block || count <= 0) return;
      const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
      let remaining = count;
      const parts = [];
      while (remaining > 0) {
        const node = walker.nextNode();
        if (!node) break;
        const take = Math.min(node.length, remaining);
        parts.push([node, take]);
        remaining -= take;
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const [node, take] = parts[i];
        node.deleteData(0, take);
      }
    }

    function notifyChange() {
      updatePlaceholder();
      if (suppress) return;
      clearTimeout(changeTimer);
      changeTimer = setTimeout(() => {
        post({ type: 'change', html: editor.innerHTML });
      }, 140);
    }

    function insertHtml(html) {
      editor.focus();
      document.execCommand('insertHTML', false, html);
      notifyChange();
    }

    function wrapInline(tag, fallback) {
      const sel = window.getSelection();
      const text = sel && sel.toString();
      if (text) {
        document.execCommand('insertHTML', false, '<' + tag + '>' + escapeHtml(text) + '</' + tag + '>');
      } else {
        insertHtml('<' + tag + '>' + fallback + '</' + tag + '>');
      }
      notifyChange();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function toggleHeading(level) {
      const block = currentBlock();
      const tag = 'h' + level;
      if (block && block.tagName && block.tagName.toLowerCase() === tag) {
        document.execCommand('formatBlock', false, 'p');
      } else {
        document.execCommand('formatBlock', false, tag);
      }
      notifyChange();
    }

    function toggleInlineCode() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentElement;
      if (node && node.closest && node.closest('code') && !node.closest('pre')) {
        const code = node.closest('code');
        const text = document.createTextNode(code.textContent);
        code.replaceWith(text);
        notifyChange();
        return;
      }
      wrapInline('code', '程式碼');
    }

    function insertCodeBlock() {
      insertHtml('<pre><code class="language-text">程式碼</code></pre><p><br></p>');
    }

    function insertTaskList() {
      insertHtml('<ul><li><input type="checkbox"> 待辦項目</li></ul><p><br></p>');
    }

    function insertTable() {
      insertHtml('<table><thead><tr><th>欄位一</th><th>欄位二</th></tr></thead><tbody><tr><td>內容</td><td>內容</td></tr></tbody></table><p><br></p>');
    }

    function saveSelection() {
      const sel = window.getSelection();
      savedRange = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
    }

    function restoreSelection() {
      if (!savedRange) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }

    function openDialog(kind) {
      dialogKind = kind;
      saveSelection();
      const selected = window.getSelection() ? window.getSelection().toString() : '';
      document.getElementById('dlgTitle').textContent = kind === 'image' ? '插入圖片' : '插入連結';
      document.getElementById('dlgTextLabel').textContent = kind === 'image' ? '替代文字' : '顯示文字';
      document.getElementById('dlgHrefLabel').textContent = kind === 'image' ? '圖片路徑或網址' : '網址';
      document.getElementById('dlgText').value = selected || (kind === 'image' ? '圖片說明' : '連結文字');
      document.getElementById('dlgHref').value = kind === 'image' ? 'image.jpg' : 'https://';
      mask.classList.add('open');
      setTimeout(() => document.getElementById('dlgHref').focus(), 20);
    }

    function closeDialog() {
      mask.classList.remove('open');
      editor.focus();
      restoreSelection();
    }

    document.getElementById('dlgCancel').addEventListener('click', closeDialog);
    document.getElementById('dlgOk').addEventListener('click', () => {
      const text = document.getElementById('dlgText').value || '';
      const href = document.getElementById('dlgHref').value || '';
      closeDialog();
      if (dialogKind === 'image') {
        insertHtml('<img src="' + escapeHtml(href) + '" alt="' + escapeHtml(text) + '"/>');
      } else {
        insertHtml('<a href="' + escapeHtml(href) + '">' + escapeHtml(text) + '</a>');
      }
    });
    mask.addEventListener('click', (event) => {
      if (event.target === mask) closeDialog();
    });

    function handleMarkdownShortcut(event) {
      if (event.key !== ' ') return false;
      const block = currentBlock();
      if (!block || block.tagName === 'PRE') return false;
      const before = textBeforeCaret(block);
      const heading = /^(#{1,6})$/.exec(before);
      if (heading) {
        event.preventDefault();
        clearPrefix(block, heading[1].length);
        document.execCommand('formatBlock', false, 'h' + heading[1].length);
        notifyChange();
        return true;
      }
      if (before === '>' ) {
        event.preventDefault();
        clearPrefix(block, 1);
        document.execCommand('formatBlock', false, 'blockquote');
        notifyChange();
        return true;
      }
      if (before === '-' || before === '*') {
        event.preventDefault();
        clearPrefix(block, 1);
        document.execCommand('insertUnorderedList');
        notifyChange();
        return true;
      }
      if (/^\d+\.$/.test(before)) {
        event.preventDefault();
        clearPrefix(block, before.length);
        document.execCommand('insertOrderedList');
        notifyChange();
        return true;
      }
      if (before === '---' || before === '***') {
        event.preventDefault();
        clearPrefix(block, before.length);
        document.execCommand('insertHorizontalRule');
        notifyChange();
        return true;
      }
      if (before === '```' || before === '``') {
        event.preventDefault();
        clearPrefix(block, before.length);
        insertCodeBlock();
        return true;
      }
      return false;
    }

    editor.addEventListener('input', notifyChange);
    editor.addEventListener('keyup', updatePlaceholder);
    editor.addEventListener('blur', () => {
      clearTimeout(changeTimer);
      if (!suppress) post({ type: 'change', html: editor.innerHTML });
      updatePlaceholder();
    });
    editor.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey) {
        const key = event.key.toLowerCase();
        if (key === 'b') { event.preventDefault(); document.execCommand('bold'); notifyChange(); return; }
        if (key === 'i') { event.preventDefault(); document.execCommand('italic'); notifyChange(); return; }
        if (key === 'k') { event.preventDefault(); openDialog('link'); return; }
        if (key === 's') { event.preventDefault(); post({ type: 'save', html: editor.innerHTML }); return; }
        if (event.shiftKey && key === 'm') { event.preventDefault(); post({ type: 'toggleMode', html: editor.innerHTML }); return; }
      }
      if (handleMarkdownShortcut(event)) return;
      if (event.key === 'Tab') {
        const block = currentBlock();
        if (block && block.tagName === 'LI') {
          event.preventDefault();
          document.execCommand(event.shiftKey ? 'outdent' : 'indent');
          notifyChange();
        }
      }
      if (event.key === 'Enter' && currentBlock() && currentBlock().tagName === 'PRE') {
        event.preventDefault();
        document.execCommand('insertText', false, '\n');
        notifyChange();
      }
    });

    editor.addEventListener('paste', (event) => {
      event.preventDefault();
      const html = event.clipboardData.getData('text/html');
      const text = event.clipboardData.getData('text/plain');
      if (html && !/class=["']?Mso|xmlns:o=|office:office/i.test(html)) {
        const template = document.createElement('template');
        template.innerHTML = html;
        template.content.querySelectorAll('script,iframe,object,embed,style').forEach((el) => el.remove());
        template.content.querySelectorAll('*').forEach((el) => {
          [...el.attributes].forEach((attr) => {
            if (attr.name.startsWith('on') || (attr.name === 'href' && /^\s*javascript:/i.test(attr.value)))
              el.removeAttribute(attr.name);
          });
        });
        document.execCommand('insertHTML', false, template.innerHTML);
      } else {
        document.execCommand('insertText', false, text);
      }
      notifyChange();
    });

    editor.addEventListener('click', (event) => {
      if (event.target && event.target.matches && event.target.matches('input[type="checkbox"]')) {
        notifyChange();
      }
    });

    window.hugoerSetHtml = function (html) {
      suppress = true;
      editor.innerHTML = html || '';
      updatePlaceholder();
      suppress = false;
    };

    window.hugoerFocus = function () {
      editor.focus();
    };

    window.hugoerFlush = function () {
      post({ type: 'flush', html: editor.innerHTML });
    };

    window.hugoerCommand = function (name, argument) {
      editor.focus();
      switch (name) {
        case 'undo': document.execCommand('undo'); break;
        case 'redo': document.execCommand('redo'); break;
        case 'bold': document.execCommand('bold'); break;
        case 'italic': document.execCommand('italic'); break;
        case 'strike': document.execCommand('strikeThrough'); break;
        case 'heading': toggleHeading(parseInt(argument || '2', 10)); return;
        case 'inlineCode': toggleInlineCode(); return;
        case 'codeBlock': insertCodeBlock(); return;
        case 'link': openDialog('link'); return;
        case 'image': openDialog('image'); return;
        case 'quote': document.execCommand('formatBlock', false, 'blockquote'); break;
        case 'bulletList': document.execCommand('insertUnorderedList'); break;
        case 'orderedList': document.execCommand('insertOrderedList'); break;
        case 'taskList': insertTaskList(); return;
        case 'table': insertTable(); return;
        case 'hr': document.execCommand('insertHorizontalRule'); break;
        case 'insertHtml':
          if (argument) insertHtml(argument);
          return;
        default: return;
      }
      notifyChange();
    };

    updatePlaceholder();
    post({ type: 'ready' });
  </script>
</body>
</html>
