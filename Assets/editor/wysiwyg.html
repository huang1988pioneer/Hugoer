<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https: http: file: blob:; media-src data: https: http: file: blob:;"/>
  <title>Hugoer Markdown Editor</title>
  <!-- Quill (https://quilljs.com, BSD-3-Clause) is vendored under Assets/editor/quill/.
       MarkdownWysiwygEditor.LoadEditorHtml inlines it at the markers below because the
       page is loaded with NavigateToString and the CSP forbids external resources. -->
  <style>/*__QUILL_CORE_CSS__*/</style>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0d1218;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }
    #editor.ql-container {
      height: 100%;
      font-family: inherit;
      font-size: 16.5px;
      border: 0;
    }
    #editor .ql-editor {
      padding: 28px max(36px, calc((100% - 860px) / 2)) 96px;
      line-height: 1.7;
      caret-color: #7cdaf9;
      tab-size: 4;
    }
    #editor .ql-editor::after {
      content: "";
      display: table;
      clear: both;
    }
    #editor .ql-editor.ql-blank::before {
      color: #6b7785;
      font-style: italic;
      left: max(36px, calc((100% - 860px) / 2));
      right: max(36px, calc((100% - 860px) / 2));
    }
    #editor .ql-editor h1, #editor .ql-editor h2, #editor .ql-editor h3,
    #editor .ql-editor h4, #editor .ql-editor h5, #editor .ql-editor h6 {
      color: #7cdaf9;
      margin: 1.25em 0 0.45em;
      font-weight: 650;
      line-height: 1.3;
    }
    #editor .ql-editor h1 { font-size: 2em; border-bottom: 1px solid #2a3648; padding-bottom: 0.2em; }
    #editor .ql-editor h2 { font-size: 1.55em; border-bottom: 1px solid #243041; padding-bottom: 0.15em; }
    #editor .ql-editor h3 { font-size: 1.28em; }
    #editor .ql-editor h4 { font-size: 1.1em; }
    #editor .ql-editor h5, #editor .ql-editor h6 { font-size: 1em; }
    #editor .ql-editor p { margin: 0.7em 0; }
    #editor .ql-editor a { color: #5ec8f0; text-decoration: none; cursor: text; }
    #editor .ql-editor a:hover { text-decoration: underline; }
    #editor .ql-editor code, #editor .ql-editor kbd {
      font-family: Consolas, "Cascadia Mono", Menlo, monospace;
      background: #1a2330;
      color: #e6edf3;
      padding: 0.12em 0.38em;
      border-radius: 4px;
      font-size: 0.92em;
    }
    #editor .ql-editor kbd { border: 1px solid #2a3648; border-bottom-width: 2px; }
    #editor .ql-editor mark { background: #6b5a14; color: #fff3c4; padding: 0 0.15em; border-radius: 3px; }
    #editor .ql-editor ins { text-decoration: underline; text-decoration-color: #7cdaf9; }
    #editor .ql-editor strong { color: #fff; }
    #editor .ql-editor .ql-code-block-container {
      font-family: Consolas, "Cascadia Mono", Menlo, monospace;
      font-size: 0.92em;
      background: #121a24;
      border: 1px solid #2a3648;
      border-radius: 8px;
      padding: 12px 14px;
      margin: 0.9em 0;
      color: #d7e0ea;
      position: relative;
    }
    #editor .ql-editor .ql-code-block-container .ql-code-block:first-child[data-language]::after {
      content: attr(data-language);
      position: absolute;
      top: 6px;
      right: 10px;
      font-size: 11px;
      color: #6b7785;
      pointer-events: none;
    }
    #editor .ql-editor blockquote {
      margin: 0;
      padding: 0.2em 1em;
      border-left: 2px solid #0e7490;
      background: #151c26;
      color: #c5d0dc;
    }
    #editor .ql-editor ol { padding-left: 0.4em; margin: 0.6em 0; }
    #editor .ql-editor li { margin: 0.2em 0; }
    #editor .ql-editor li > .ql-ui:before { color: #7cdaf9; }
    #editor .ql-editor li[data-list=checked] > .ql-ui:before,
    #editor .ql-editor li[data-list=unchecked] > .ql-ui:before { font-size: 1.1em; }
    #editor .ql-editor li[data-list=checked] { color: #9aa8b8; }
    #editor .ql-editor table { border-collapse: collapse; width: 100%; margin: 1em 0; table-layout: fixed; }
    #editor .ql-editor td { border: 1px solid #2a3648; padding: 8px 10px; min-width: 4em; }
    #editor .ql-editor tr:first-child td { background: #1a2330; font-weight: 650; }
    #editor .ql-editor hr {
      border: none;
      border-top: 1px solid #2a3648;
      margin: 1.5em 0;
      cursor: default;
    }
    #editor .ql-editor img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      cursor: pointer;
    }
    #editor .ql-editor img[data-hugoer-align] { display: block; }
    #editor .ql-editor img[data-hugoer-align="left"] { margin: 0.5em auto 0.5em 0; }
    #editor .ql-editor img[data-hugoer-align="center"] { margin: 0.5em auto; }
    #editor .ql-editor img[data-hugoer-align="right"] { margin: 0.5em 0 0.5em auto; }
    #editor .ql-editor img[data-hugoer-align="wrap-left"] { float: left; margin: 0.25em 1em 0.8em 0; }
    #editor .ql-editor img[data-hugoer-align="wrap-right"] { float: right; margin: 0.25em 0 0.8em 1em; }
    #editor .ql-editor img.hugoer-img-selected { outline: 2px solid #7cdaf9; outline-offset: 3px; cursor: grab; }
    #editor .ql-editor img.hugoer-img-moving { opacity: 0.38; cursor: grabbing; }
    #editor .ql-editor .hugoer-media { margin: 1em 0; cursor: default; }
    #editor .ql-editor .hugoer-media audio,
    #editor .ql-editor .hugoer-media video { width: 100%; max-width: 640px; display: block; }
    #editor .ql-editor .hugoer-raw {
      position: relative;
      margin: 0.9em 0;
      padding: 10px 14px;
      border: 1px dashed #2f4257;
      border-radius: 8px;
      background: #111820;
      color: #c5d0dc;
      white-space: normal;
      cursor: default;
      user-select: none;
    }
    #editor .ql-editor .hugoer-raw-label {
      position: absolute;
      top: -9px;
      right: 10px;
      padding: 0 6px;
      font-size: 11px;
      line-height: 16px;
      color: #7cdaf9;
      background: #0d1218;
      border-radius: 4px;
    }
    #editor .ql-editor .hugoer-raw-body > :first-child { margin-top: 0; }
    #editor .ql-editor .hugoer-raw-body > :last-child { margin-bottom: 0; }
    #editor .ql-editor .hugoer-raw-inline > span {
      background: #1a2330;
      border: 1px dashed #2f4257;
      border-radius: 4px;
      padding: 0 0.3em;
      color: #c5d0dc;
    }
    #imgChrome {
      position: fixed;
      display: none;
      z-index: 18;
      box-sizing: content-box;
      border: 2px solid #7cdaf9;
      border-radius: 8px;
      pointer-events: none;
    }
    #imgChrome.open { display: block; }
    #imgChrome.moving { opacity: 0; }
    #imgMoveHit {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      cursor: grab;
    }
    #imgDrop {
      position: fixed;
      display: none;
      height: 3px;
      background: #7cdaf9;
      border-radius: 99px;
      box-shadow: 0 0 0 1px rgba(13, 18, 24, 0.35);
      z-index: 19;
      pointer-events: none;
    }
    #imgDrop.open { display: block; }
    .float-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
      background: #151c26;
      border: 1px solid #2a3648;
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.38);
      pointer-events: auto;
      white-space: nowrap;
    }
    .float-bar button {
      background: #1c2736;
      color: #d7e0ea;
      border: 0;
      border-radius: 7px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
    }
    .float-bar button:hover { background: #243140; }
    .float-bar button.on { background: #0e7490; color: #fff; }
    .float-bar button.danger:hover { background: #5b2330; }
    .float-bar .sep {
      width: 1px;
      height: 16px;
      background: #2a3648;
      margin: 0 2px;
    }
    #imgToolbar {
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      z-index: 3;
    }
    #imgChrome.toolbar-below #imgToolbar {
      bottom: auto;
      top: calc(100% + 8px);
    }
    #imgChrome.toolbar-end #imgToolbar {
      left: auto;
      right: 0;
    }
    #imgSize {
      color: #9aa8b8;
      font-size: 11px;
      padding: 0 6px 0 4px;
      min-width: 3.5em;
    }
    .img-handle {
      position: absolute;
      width: 11px;
      height: 11px;
      background: #7cdaf9;
      border: 2px solid #0d1218;
      border-radius: 3px;
      pointer-events: auto;
      box-sizing: border-box;
      touch-action: none;
      z-index: 2;
    }
    .img-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
    .img-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
    .img-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .img-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
    #tableBar {
      position: fixed;
      display: none;
      z-index: 17;
    }
    #tableBar.open { display: flex; }
    #mask {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7, 10, 14, 0.55);
      align-items: center; justify-content: center;
      z-index: 20;
    }
    #mask.open { display: flex; }
    #dialog {
      width: min(420px, calc(100% - 32px));
      background: #151c26;
      border: 1px solid #2a3648;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    #dialog h2 { margin: 0 0 12px; font-size: 15px; color: #7cdaf9; border: 0; }
    #dialog label { display: block; font-size: 12px; color: #9aa8b8; margin: 8px 0 4px; }
    #dialog input {
      width: 100%; box-sizing: border-box;
      background: #0d1218; color: #e6edf3;
      border: 1px solid #2a3648; border-radius: 8px;
      padding: 8px 10px; font-size: 14px;
    }
    #dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #dialog button {
      background: #1c2736; color: #d7e0ea; border: 0;
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600;
    }
    #dialog button.primary { background: #0e7490; color: #fff; }
  </style>
</head>
<body>
  <div id="editor" spellcheck="true"></div>
  <div id="imgChrome">
    <div id="imgToolbar" class="float-bar">
      <button type="button" data-move="-1" title="上移">上</button>
      <button type="button" data-move="1" title="下移">下</button>
      <span class="sep"></span>
      <button type="button" data-align="left" title="靠左">左</button>
      <button type="button" data-align="center" title="置中">中</button>
      <button type="button" data-align="right" title="靠右">右</button>
      <span class="sep"></span>
      <button type="button" data-align="wrap-left" title="文字從右側環繞">繞左</button>
      <button type="button" data-align="wrap-right" title="文字從左側環繞">繞右</button>
      <span class="sep"></span>
      <button type="button" id="imgReset" title="恢復原始大小與預設排版">原始</button>
      <span id="imgSize"></span>
    </div>
    <div id="imgMoveHit" title="拖曳移動位置"></div>
    <span class="img-handle nw" data-handle="nw"></span>
    <span class="img-handle ne" data-handle="ne"></span>
    <span class="img-handle sw" data-handle="sw"></span>
    <span class="img-handle se" data-handle="se"></span>
  </div>
  <div id="imgDrop"></div>
  <div id="tableBar" class="float-bar">
    <button type="button" data-table="insertRowAbove" title="在上方插入列">↑ 列</button>
    <button type="button" data-table="insertRowBelow" title="在下方插入列">↓ 列</button>
    <button type="button" data-table="insertColumnLeft" title="在左側插入欄">← 欄</button>
    <button type="button" data-table="insertColumnRight" title="在右側插入欄">→ 欄</button>
    <span class="sep"></span>
    <button type="button" data-table="deleteRow" class="danger" title="刪除目前列">刪列</button>
    <button type="button" data-table="deleteColumn" class="danger" title="刪除目前欄">刪欄</button>
    <button type="button" data-table="deleteTable" class="danger" title="刪除整個表格">刪表格</button>
  </div>
  <div id="mask">
    <div id="dialog">
      <h2 id="dlgTitle">插入連結</h2>
      <label id="dlgTextLabel" for="dlgText">顯示文字</label>
      <input id="dlgText" type="text"/>
      <label id="dlgHrefLabel" for="dlgHref">網址</label>
      <input id="dlgHref" type="text"/>
      <div class="actions">
        <button type="button" id="dlgCancel">取消</button>
        <button type="button" class="primary" id="dlgOk">確定</button>
      </div>
    </div>
  </div>
  <script>/*__QUILL_JS__*/</script>
  <script>
    // ---------------------------------------------------------------------
    // Hugoer Markdown editor built on Quill 2.
    //
    // Contract with MarkdownWysiwygEditor.cs (unchanged from the previous
    // contenteditable surface): C# pushes Markdig HTML through hugoerSetHtml,
    // the page posts canonical HTML back ({type: change|flush|save|toggleMode})
    // and MarkdownWysiwygConverter.FromEditableHtml turns it into Markdown.
    // Anything Quill cannot model is kept verbatim as a read-only raw block.
    // ---------------------------------------------------------------------
    const Delta = Quill.import('delta');
    const Parchment = Quill.import('parchment');
    const Inline = Quill.import('blots/inline');
    const BlockEmbed = Quill.import('blots/block/embed');
    const Embed = Quill.import('blots/embed');
    const BaseLink = Quill.import('formats/link');
    const BaseImage = Quill.import('formats/image');
    const BaseCodeBlock = Quill.import('formats/code-block');
    const BaseClipboard = Quill.import('modules/clipboard');

    const mediaMap = Object.create(null);
    const BLOCK_FORMATS = ['header', 'blockquote', 'list', 'indent', 'code-block', 'table'];

    function post(payload) {
      if (typeof invokeCSharpAction === 'function') {
        invokeCSharpAction(JSON.stringify(payload));
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isSafeUrl(value, kind) {
      const url = String(value || '').trim();
      if (!url || /[\u0000-\u001f]/.test(url)) return false;
      if (/^(?:javascript|vbscript|file):/i.test(url)) return false;
      if (/^data:/i.test(url)) return kind === 'image' && /^data:image\//i.test(url);
      return true;
    }

    function lookupMedia(src) {
      if (!src) return null;
      if (mediaMap[src]) return mediaMap[src];
      try {
        const decoded = decodeURI(src);
        if (decoded !== src && mediaMap[decoded]) return mediaMap[decoded];
      } catch {}
      return null;
    }

    function previewSrc(src) {
      if (!src) return '';
      if (/^(data:|blob:|https?:)/i.test(src)) return src;
      return lookupMedia(src) || src;
    }

    function mergeMedia(media) {
      if (media) Object.assign(mediaMap, media);
    }

    // Raw HTML is shown inside the editor only as an inert preview; the
    // original markup travels untouched in data-raw.
    function sanitizeForDisplay(html) {
      const template = document.createElement('template');
      template.innerHTML = html || '';
      template.content.querySelectorAll('script,iframe,object,embed,style,link,meta,base,form').forEach((el) => el.remove());
      template.content.querySelectorAll('*').forEach((el) => {
        [...el.attributes].forEach((attr) => {
          const name = attr.name.toLowerCase();
          if (name.startsWith('on') || name === 'contenteditable'
              || ((name === 'href' || name === 'src') && !isSafeUrl(attr.value, name === 'src' ? 'image' : 'link')))
            el.removeAttribute(attr.name);
        });
        if (el.hasAttribute('src')) el.setAttribute('src', previewSrc(el.getAttribute('src')));
      });
      return template.innerHTML;
    }

    // ----- Blots ----------------------------------------------------------

    class HugoerLink extends BaseLink {
      static sanitize(url) {
        return isSafeUrl(url, 'link') ? url : '#';
      }
      static create(value) {
        const node = super.create(value);
        node.removeAttribute('target');
        node.removeAttribute('rel');
        return node;
      }
    }

    const IMAGE_ATTRIBUTES = { alt: 'alt', width: 'width', hugoerAlign: 'data-hugoer-align' };
    const IMAGE_ALIGNS = ['left', 'center', 'right', 'wrap-left', 'wrap-right'];

    class HugoerImage extends BaseImage {
      static create(value) {
        const node = Parchment.EmbedBlot.create.call(this, value);
        const src = typeof value === 'string' ? value : '';
        node.setAttribute('data-hugoer-src', src);
        if (isSafeUrl(src, 'image')) node.setAttribute('src', previewSrc(src));
        node.setAttribute('draggable', 'false');
        return node;
      }
      static value(node) {
        return node.getAttribute('data-hugoer-src') || node.getAttribute('src') || '';
      }
      static formats(node) {
        const formats = {};
        if (node.hasAttribute('alt')) formats.alt = node.getAttribute('alt');
        let width = parseInt(node.getAttribute('width') || '', 10);
        if (!(width > 0)) {
          const match = /(?:^|;)\s*width\s*:\s*(\d+)px/i.exec(node.getAttribute('style') || '');
          if (match) width = parseInt(match[1], 10);
        }
        if (width > 0) formats.width = String(width);
        let align = node.getAttribute('data-hugoer-align') || '';
        if (!IMAGE_ALIGNS.includes(align)) align = alignFromStyle(node.getAttribute('style') || '');
        if (align) formats.hugoerAlign = align;
        return formats;
      }
      format(name, value) {
        const attribute = IMAGE_ATTRIBUTES[name];
        if (!attribute) {
          super.format(name, value);
          return;
        }
        if (value) this.domNode.setAttribute(attribute, value);
        else this.domNode.removeAttribute(attribute);
      }
    }

    function alignFromStyle(style) {
      const css = style.toLowerCase().replace(/\s+/g, '');
      if (css.includes('float:left')) return 'wrap-left';
      if (css.includes('float:right')) return 'wrap-right';
      if (css.includes('margin:0.5emauto0.5em0')) return 'left';
      if (css.includes('margin:0.5em00.5emauto')) return 'right';
      if (css.includes('margin:0.5emauto') || css.includes('margin:0auto')) return 'center';
      return '';
    }

    class LanguageCodeBlock extends BaseCodeBlock {
      static create(value) {
        const node = super.create(value);
        if (typeof value === 'string' && value && value !== 'plain') node.setAttribute('data-language', value);
        return node;
      }
      static formats(node) {
        return node.getAttribute('data-language') || true;
      }
      format(name, value) {
        if (name === this.statics.blotName && value) {
          if (typeof value === 'string' && value !== 'plain') this.domNode.setAttribute('data-language', value);
          else this.domNode.removeAttribute('data-language');
          return;
        }
        super.format(name, value);
      }
    }

    class Divider extends BlockEmbed {}
    Divider.blotName = 'divider';
    Divider.tagName = 'HR';

    class HugoerMedia extends BlockEmbed {
      static create(value) {
        const node = super.create(value);
        const tag = value && value.tag === 'video' ? 'video' : 'audio';
        const src = (value && value.src) || '';
        node.setAttribute('contenteditable', 'false');
        node.setAttribute('data-tag', tag);
        node.setAttribute('data-src', src);
        const media = document.createElement(tag);
        media.controls = true;
        if (isSafeUrl(src, 'image')) media.setAttribute('src', previewSrc(src));
        node.appendChild(media);
        return node;
      }
      static value(node) {
        return { tag: node.getAttribute('data-tag') || 'audio', src: node.getAttribute('data-src') || '' };
      }
    }
    HugoerMedia.blotName = 'hugoerMedia';
    HugoerMedia.tagName = 'DIV';
    HugoerMedia.className = 'hugoer-media';

    class HugoerRaw extends BlockEmbed {
      static create(value) {
        const node = super.create(value);
        node.setAttribute('contenteditable', 'false');
        node.setAttribute('data-raw', value || '');
        node.setAttribute('title', '此區塊請在「原始碼」模式編輯（Ctrl+Shift+M）');
        const label = document.createElement('span');
        label.className = 'hugoer-raw-label';
        label.textContent = describeRaw(value || '');
        const body = document.createElement('div');
        body.className = 'hugoer-raw-body';
        body.innerHTML = sanitizeForDisplay(value);
        node.append(label, body);
        return node;
      }
      static value(node) {
        return node.getAttribute('data-raw') || '';
      }
    }
    HugoerRaw.blotName = 'hugoerRaw';
    HugoerRaw.tagName = 'DIV';
    HugoerRaw.className = 'hugoer-raw';

    function describeRaw(html) {
      if (/markdown-alert/i.test(html)) return '提示框';
      if (/^<div[^>]*class="[^"]*math/i.test(html)) return '數學公式';
      if (/class="[^"]*footnotes/i.test(html)) return '註腳';
      if (/^<details/i.test(html)) return '摺疊區塊';
      if (/^<dl/i.test(html)) return '定義清單';
      if (/^<figure/i.test(html)) return '圖說';
      return 'HTML 區塊';
    }

    class HugoerRawInline extends Embed {
      static create(value) {
        const node = super.create(value);
        node.setAttribute('data-raw', value || '');
        const inner = document.createElement('span');
        inner.innerHTML = sanitizeForDisplay(value);
        node.appendChild(inner);
        return node;
      }
      static value(node) {
        return node.getAttribute('data-raw') || '';
      }
    }
    HugoerRawInline.blotName = 'hugoerRawInline';
    HugoerRawInline.tagName = 'SPAN';
    HugoerRawInline.className = 'hugoer-raw-inline';

    // Markdown hard line break ("two trailing spaces") inside one paragraph.
    class SoftBreak extends Parchment.EmbedBlot {
      static value() {
        return true;
      }
    }
    SoftBreak.blotName = 'softbreak';

        };
        if (attrs.list) {
          html += renderList(run((a) => !!a.list));
        } else if (attrs['code-block']) {
          const lines = run((a) => !!a['code-block']);
          const language = typeof lines[0].attrs['code-block'] === 'string' && lines[0].attrs['code-block'] !== 'plain'
            ? lines[0].attrs['code-block'] : '';
          const code = lines.map((line) => line.ops.map((op) => typeof op.insert === 'string' ? op.insert : '').join('')).join('\n');
          html += '<pre><code' + (language ? ' class="language-' + escapeHtml(language) + '"' : '') + '>'
            + escapeHtml(code) + '</code></pre>';
        } else if (attrs.table) {
          const cells = run((a) => !!a.table);
          html += '<table><tbody>';
          let row = null;
          cells.forEach((cell) => {
            if (cell.attrs.table !== row) {
              if (row !== null) html += '</tr>';
              html += '<tr>';
              row = cell.attrs.table;
            }
            html += '<td>' + renderInline(cell.ops, 0) + '</td>';
          });
          html += '</tr></tbody></table>';
        } else if (attrs.blockquote) {
          const lines = run((a) => !!a.blockquote);
          html += '<blockquote>' + lines.map((line) => '<p>' + renderInline(line.ops, 0) + '</p>').join('') + '</blockquote>';
        } else if (attrs.header) {
          html += '<h' + attrs.header + '>' + renderInline(block.ops, 0) + '</h' + attrs.header + '>';
          i += 1;
        } else {
          if (block.ops.length) html += '<p>' + renderInline(block.ops, 0) + '</p>';
          i += 1;
        }
      }
      return html;
    }

    function snapshotHtml() {
      return deltaToHtml(quill.getContents());
    }

    // ----- Change notifications -------------------------------------------

    let suppress = false;
    let changeTimer = 0;
    // True while the document has edits the host has not received yet. Messages carry it so
    // the host never rewrites (normalises) an article that was only opened, not edited.
    let dirty = false;

    function notifyChange() {
      if (suppress) return;
      clearTimeout(changeTimer);
      changeTimer = setTimeout(() => flushChange('change'), 140);
    }

    function flushChange(type) {
      clearTimeout(changeTimer);
      post({ type: type || 'change', html: snapshotHtml(), dirty });
      dirty = false;
    }

    quill.on('text-change', (delta, oldDelta, source) => {
      if (source === 'silent') return;
      if (!suppress) dirty = true;
      notifyChange();
      if (selectedImg) requestAnimationFrame(layoutImageChrome);
    });
    quill.on('selection-change', (range, oldRange, source) => {
      updateTableBar(range);
      if (range == null && oldRange != null && !suppress && dirty) flushChange('change');
    });

    // ----- Image chrome: select / resize / align / move -------------------

    const imgChrome = document.getElementById('imgChrome');
    const imgSizeLabel = document.getElementById('imgSize');
    const imgDrop = document.getElementById('imgDrop');
    let selectedImg = null;
    let resizeState = null;
    let moveState = null;

    function imageIndex(img) {
      const blot = img && Quill.find(img);
      return blot && blot.scroll === quill.scroll ? quill.getIndex(blot) : -1;
    }

    function imageAt(index) {
      for (const img of editorRoot.querySelectorAll('img')) {
        if (imageIndex(img) === index) return img;
      }
      return null;
    }

    function topLevelBlot(blot) {
      let current = blot;
      while (current && current.parent && current.parent !== quill.scroll) current = current.parent;
      return current && current.parent === quill.scroll ? current : null;
    }

    function editorMaxImageWidth() {
      const style = window.getComputedStyle(editorRoot);
      const pad = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      return Math.max(120, Math.floor(editorRoot.clientWidth - pad));
    }

    function layoutImageChrome() {
      if (!selectedImg || !selectedImg.isConnected) {
        clearImageSelection();
        return;
      }
      const rect = selectedImg.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) {
        imgChrome.classList.remove('open');
        return;
      }
      imgChrome.style.left = (rect.left - 2) + 'px';
      imgChrome.style.top = (rect.top - 2) + 'px';
      imgChrome.style.width = rect.width + 'px';
      imgChrome.style.height = rect.height + 'px';
      imgChrome.classList.toggle('toolbar-below', rect.top < 52);
      imgChrome.classList.toggle('toolbar-end', rect.left + 320 > window.innerWidth);
      imgChrome.classList.add('open');
      imgSizeLabel.textContent = Math.round(rect.width) + ' px';
      const align = selectedImg.getAttribute('data-hugoer-align') || '';
      imgChrome.querySelectorAll('#imgToolbar [data-align]').forEach((btn) => {
        btn.classList.toggle('on', btn.getAttribute('data-align') === align);
      });
    }

    function selectImage(img) {
      if (selectedImg && selectedImg !== img) selectedImg.classList.remove('hugoer-img-selected');
      if (quill.hasFocus()) quill.blur();
      const sel = window.getSelection();
      if (sel) sel.removeAllRanges();
      selectedImg = img;
      img.classList.add('hugoer-img-selected');
      if (!img.complete) img.addEventListener('load', layoutImageChrome, { once: true });
      layoutImageChrome();
    }

    function clearImageSelection() {
      if (selectedImg) selectedImg.classList.remove('hugoer-img-selected', 'hugoer-img-moving');
      selectedImg = null;
      resizeState = null;
      moveState = null;
      imgChrome.classList.remove('open', 'moving');
      imgDrop.classList.remove('open');
    }

    function formatSelectedImage(formats) {
      const index = imageIndex(selectedImg);
      if (index < 0) return;
      quill.formatText(index, 1, formats, 'user');
      layoutImageChrome();
    }

    function blockFormatsOff() {
      const off = {};
      BLOCK_FORMATS.forEach((name) => { off[name] = false; });
      return off;
    }

    // Moves the selected image so it becomes its own paragraph before/after `target`
    // (a direct child of the Quill scroll).
    function moveImageTo(target, before) {
      const index = imageIndex(selectedImg);
      if (index < 0 || !target) return;
      const op = quill.getContents(index, 1).ops[0];
      const [line] = quill.getLine(index);
      const unit = topLevelBlot(line);
      if (target === unit) return;

      const lineIndex = quill.getIndex(line);
      const soleOnLine = line.length() === 2 && line.parent === quill.scroll;
      if (soleOnLine) quill.deleteText(lineIndex, 2, 'user');
      else quill.deleteText(index, 1, 'user');

      let at;
      if (!target.scroll || !target.domNode.isConnected) return;
      if (before) at = quill.getIndex(target);
      else at = target.next ? quill.getIndex(target.next) : null;

      if (at === null) {
        const end = quill.getLength() - 1;
        const [lastLine] = quill.getLine(end);
        const lastFormats = lastLine && lastLine.formats ? lastLine.formats() : {};
        quill.updateContents(new Delta().retain(end).insert('\n', lastFormats).insert(op.insert, op.attributes), 'user');
        quill.formatLine(end + 1, 1, blockFormatsOff(), 'user');
        at = end + 1;
      } else {
        quill.updateContents(new Delta().retain(at).insert(op.insert, op.attributes).insert('\n'), 'user');
      }
      const moved = imageAt(at);
      if (moved) {
        selectImage(moved);
        moved.scrollIntoView({ block: 'nearest' });
      } else {
        clearImageSelection();
      }
    }

    function moveImageBy(dir) {
      const index = imageIndex(selectedImg);
      if (index < 0) return;
      const [line] = quill.getLine(index);
      const unit = topLevelBlot(line);
      if (!unit) return;
      const target = dir < 0 ? unit.prev : unit.next;
      if (target) moveImageTo(target, dir < 0);
    }

    function dropTargetAt(y) {
      const selectedUnit = topLevelBlot(quill.getLine(imageIndex(selectedImg))[0]);
      let best = null;
      let bestDistance = Infinity;
      quill.scroll.children.forEach((child) => {
        if (child === selectedUnit) return;
        const rect = child.domNode.getBoundingClientRect();
        const distance = y < rect.top ? rect.top - y : (y > rect.bottom ? y - rect.bottom : 0);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = { blot: child, rect, before: y < rect.top + rect.height / 2 };
        }
      });
      return best;
    }

    function startImageMove(event) {
      if (!selectedImg || resizeState) return;
      moveState = { startX: event.clientX, startY: event.clientY, active: false, target: null };
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch {}
    }

    function onImageMoveMove(event) {
      if (!moveState || !selectedImg) return;
      const dx = event.clientX - moveState.startX;
      const dy = event.clientY - moveState.startY;
      if (!moveState.active) {
        if (dx * dx + dy * dy < 36) return;
        moveState.active = true;
        selectedImg.classList.add('hugoer-img-moving');
        imgChrome.classList.add('moving');
      }
      event.preventDefault();
      const target = dropTargetAt(event.clientY);
      moveState.target = target;
      if (!target) return;
      imgDrop.style.top = ((target.before ? target.rect.top : target.rect.bottom) - 1) + 'px';
      imgDrop.style.left = target.rect.left + 'px';
      imgDrop.style.width = Math.max(24, target.rect.width) + 'px';
      imgDrop.classList.add('open');
    }

    function endImageMove() {
      if (!moveState) return;
      const { active, target } = moveState;
      moveState = null;
      imgDrop.classList.remove('open');
      imgChrome.classList.remove('moving');
      if (selectedImg) selectedImg.classList.remove('hugoer-img-moving');
      if (active && target && selectedImg) moveImageTo(target.blot, target.before);
      else layoutImageChrome();
    }

    function startImageResize(event, handle) {
      if (!selectedImg) return;
      event.preventDefault();
      event.stopPropagation();
      resizeState = { handle, startX: event.clientX, startWidth: selectedImg.getBoundingClientRect().width, width: 0 };
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch {}
    }

    function onImageResizeMove(event) {
      if (!resizeState || !selectedImg) return;
      event.preventDefault();
      const dx = event.clientX - resizeState.startX;
      const sign = (resizeState.handle === 'nw' || resizeState.handle === 'sw') ? -1 : 1;
      const width = Math.max(64, Math.min(editorMaxImageWidth(), Math.round(resizeState.startWidth + dx * sign)));
      resizeState.width = width;
      selectedImg.style.width = width + 'px';
      layoutImageChrome();
    }

    function endImageResize() {
      if (!resizeState) return;
      const width = resizeState.width;
      resizeState = null;
      if (!selectedImg) return;
      selectedImg.style.width = '';
      if (width > 0) formatSelectedImage({ width: String(width) });
    }

    document.getElementById('imgToolbar').addEventListener('mousedown', (event) => event.preventDefault());
    document.getElementById('imgToolbar').addEventListener('click', (event) => {
      const btn = event.target.closest('button');
      if (!btn || !selectedImg) return;
      if (btn.id === 'imgReset') {
        formatSelectedImage({ width: false, hugoerAlign: false });
      } else if (btn.hasAttribute('data-move')) {
        moveImageBy(parseInt(btn.getAttribute('data-move'), 10) || 0);
      } else if (btn.hasAttribute('data-align')) {
        const align = btn.getAttribute('data-align');
        const current = selectedImg.getAttribute('data-hugoer-align');
        formatSelectedImage({ hugoerAlign: current === align ? false : align });
      }
    });
    imgChrome.querySelectorAll('.img-handle').forEach((handle) => {
      handle.addEventListener('pointerdown', (event) => startImageResize(event, handle.getAttribute('data-handle')));
    });
    document.getElementById('imgMoveHit').addEventListener('pointerdown', (event) => {
      startImageMove(event);
      event.preventDefault();
      event.stopPropagation();
    });
    window.addEventListener('pointermove', (event) => {
      if (resizeState) onImageResizeMove(event);
      else if (moveState) onImageMoveMove(event);
    });
    window.addEventListener('pointerup', () => {
      if (resizeState) endImageResize();
      else if (moveState) endImageMove();
    });
    window.addEventListener('pointercancel', () => {
      if (resizeState) endImageResize();
      else if (moveState) endImageMove();
    });
    window.addEventListener('scroll', () => { layoutImageChrome(); updateTableBar(); }, true);
    window.addEventListener('resize', () => { layoutImageChrome(); updateTableBar(); });

    editorRoot.addEventListener('pointerdown', (event) => {
      const img = event.target && event.target.closest ? event.target.closest('img') : null;
      if (img && editorRoot.contains(img)) {
        selectImage(img);
        startImageMove(event);
        event.preventDefault();
      }
    });
    editorRoot.addEventListener('dragstart', (event) => {
      if (event.target && event.target.tagName === 'IMG') event.preventDefault();
    });
    editorRoot.addEventListener('click', (event) => {
      // Never let a link click navigate the WebView away from the editor.
      if (event.target && event.target.closest && event.target.closest('a')) event.preventDefault();
    });
    document.addEventListener('mousedown', (event) => {
      if (event.target.closest('#imgChrome') || event.target.closest('#mask') || event.target.closest('#tableBar')) return;
      if (event.target.closest('.ql-editor') && event.target.closest('img')) return;
      clearImageSelection();
    });

    // ----- Table contextual bar -------------------------------------------

    const tableBar = document.getElementById('tableBar');

    function currentTableNode(range) {
      const current = range === undefined ? quill.getSelection() : range;
      if (!current) return null;
      const [line] = quill.getLine(current.index);
      if (!line || !line.domNode || !line.domNode.closest) return null;
      return line.domNode.closest('table');
    }

    function updateTableBar(range) {
      const table = currentTableNode(range);
      if (!table) {
        tableBar.classList.remove('open');
        return;
      }
      const rect = table.getBoundingClientRect();
      tableBar.classList.add('open');
      const top = rect.top - tableBar.offsetHeight - 8;
      tableBar.style.top = Math.max(4, top < 4 ? rect.bottom + 8 : top) + 'px';
      tableBar.style.left = Math.max(4, rect.left) + 'px';
    }

    tableBar.addEventListener('mousedown', (event) => event.preventDefault());
    tableBar.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-table]');
      if (!btn) return;
      const action = btn.getAttribute('data-table');
      if (typeof tableModule[action] === 'function') tableModule[action]();
      requestAnimationFrame(() => updateTableBar());
    });

    // ----- Link / image dialog --------------------------------------------

    const mask = document.getElementById('mask');
    let dialogKind = 'link';
    let dialogRange = null;

    function linkRangeAt(index) {
      const [leaf, offset] = quill.getLeaf(index);
      let blot = leaf;
      while (blot && blot !== quill.scroll && !(blot instanceof HugoerLink)) blot = blot.parent;
      if (!(blot instanceof HugoerLink)) return null;
      const start = quill.getIndex(blot);
      return { index: start, length: blot.length() };
    }

    function openDialog(kind) {
      dialogKind = kind;
      dialogRange = quill.getSelection(true) || { index: quill.getLength() - 1, length: 0 };
      let text = dialogRange.length ? quill.getText(dialogRange.index, dialogRange.length) : '';
      let href = kind === 'image' ? 'image.jpg' : 'https://';
      if (kind === 'link') {
        const existing = quill.getFormat(dialogRange).link;
        if (existing) {
          href = existing;
          const linkRange = dialogRange.length ? null : linkRangeAt(dialogRange.index);
          if (linkRange) {
            dialogRange = linkRange;
            text = quill.getText(linkRange.index, linkRange.length);
          }
        }
      }
      document.getElementById('dlgTitle').textContent = kind === 'image' ? '插入圖片' : '插入連結';
      document.getElementById('dlgTextLabel').textContent = kind === 'image' ? '替代文字' : '顯示文字';
      document.getElementById('dlgHrefLabel').textContent = kind === 'image' ? '圖片路徑或網址' : '網址';
      document.getElementById('dlgText').value = text || (kind === 'image' ? '圖片說明' : '連結文字');
      document.getElementById('dlgHref').value = href;
      mask.classList.add('open');
      setTimeout(() => {
        const input = document.getElementById('dlgHref');
        input.focus();
        input.select();
      }, 20);
    }

    function closeDialog() {
      mask.classList.remove('open');
      quill.focus();
      if (dialogRange) quill.setSelection(dialogRange.index, dialogRange.length, 'silent');
    }

    function confirmDialog() {
      const text = document.getElementById('dlgText').value || '';
      const href = (document.getElementById('dlgHref').value || '').trim();
      const range = dialogRange;
      closeDialog();
      if (!range || !isSafeUrl(href, dialogKind)) return;
      if (dialogKind === 'image') {
        quill.deleteText(range.index, range.length, 'user');
        quill.insertEmbed(range.index, 'image', href, 'user');
        if (text) quill.formatText(range.index, 1, 'alt', text, 'user');
        quill.setSelection(range.index + 1, 0, 'silent');
        return;
      }
      const label = text || href;
      const current = range.length ? quill.getText(range.index, range.length) : '';
      if (range.length && current === label) {
        quill.formatText(range.index, range.length, 'link', href, 'user');
        quill.setSelection(range.index + range.length, 0, 'silent');
      } else {
        const base = inlineFormats(range.index);
        quill.deleteText(range.index, range.length, 'user');
        quill.insertText(range.index, label, Object.assign(base, { link: href }), 'user');
        quill.setSelection(range.index + label.length, 0, 'silent');
      }
    }

    document.getElementById('dlgCancel').addEventListener('click', closeDialog);
    document.getElementById('dlgOk').addEventListener('click', confirmDialog);
    mask.addEventListener('click', (event) => {
      if (event.target === mask) closeDialog();
    });
    mask.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); confirmDialog(); }
      else if (event.key === 'Escape') { event.preventDefault(); closeDialog(); }
    });

    // ----- Commands -------------------------------------------------------

    function toggleFormat(name, value) {
      const range = quill.getSelection(true);
      if (!range) return;
      const current = quill.getFormat(range)[name];
      const on = value === undefined ? !current : current !== value;
      quill.format(name, on ? (value === undefined ? true : value) : false, 'user');
    }

    function toggleInlineCode() {
      const range = quill.getSelection(true);
      if (!range) return;
      if (range.length === 0 && !quill.getFormat(range).code) {
        const placeholder = '程式碼';
        quill.insertText(range.index, placeholder, Object.assign(inlineFormats(range.index), { code: true }), 'user');
        quill.setSelection(range.index, placeholder.length, 'silent');
        return;
      }
      toggleFormat('code');
    }

    // Keep a plain paragraph after a trailing table / code block / embed so the caret
    // can always get below it. Empty paragraphs never reach the Markdown output.
    function ensureTrailingParagraph(source) {
      const last = quill.scroll.children.tail;
      if (last && last.statics.blotName !== 'block') quill.insertText(quill.getLength(), '\n', source || 'user');
    }

    function insertBlockHtml(html) {
      const range = quill.getSelection(true) || { index: quill.getLength() - 1, length: 0 };
      const delta = convertHtml(html, true);
      const [line, offset] = quill.getLine(range.index);
      let at = range.index;
      const change = new Delta().retain(at).delete(range.length);
      // Block content (tables, media, several paragraphs) starts on its own line
      // instead of merging into the paragraph the caret is in.
      const blockish = delta.ops.some((op) => isBlockEmbed(op) || (typeof op.insert === 'string' && op.insert.includes('\n')));
      if (blockish && offset > 0 && line) {
        change.insert('\n', line.formats ? line.formats() : {});
        at += 1;
      }
      quill.updateContents(change.concat(delta), 'user');
      ensureTrailingParagraph('user');
      const end = at + delta.length();
      quill.setSelection(Math.min(end, quill.getLength() - 1), 0, 'silent');
      return { index: at, length: delta.length() };
    }

    function insertHtml(html) {
      const inserted = insertBlockHtml(html || '');
      if (/<img\b/i.test(html || '')) {
        for (let i = inserted.index + inserted.length - 1; i >= inserted.index; i--) {
          const img = imageAt(i);
          if (img) {
            selectImage(img);
            break;
          }
        }
      }
    }

    function refreshMediaPreviews() {
      editorRoot.querySelectorAll('img[data-hugoer-src]').forEach((img) => {
        const src = img.getAttribute('data-hugoer-src');
        if (!isSafeUrl(src, 'image')) return;
        const mapped = previewSrc(src);
        if (img.getAttribute('src') !== mapped) img.setAttribute('src', mapped);
      });
      editorRoot.querySelectorAll('.hugoer-media').forEach((node) => {
        const media = node.querySelector('audio, video');
        const src = node.getAttribute('data-src');
        if (media && isSafeUrl(src, 'image') && media.getAttribute('src') !== previewSrc(src))
          media.setAttribute('src', previewSrc(src));
      });
      editorRoot.querySelectorAll('.hugoer-raw-body [src], .hugoer-raw-inline [src]').forEach((el) => {
        const mapped = lookupMedia(el.getAttribute('src'));
        if (mapped) el.setAttribute('src', mapped);
      });
      if (selectedImg) layoutImageChrome();
    }

    window.addEventListener('keydown', (event) => {
      if (mask.classList.contains('open')) return;
      if (event.ctrlKey || event.metaKey) {
        const key = event.key.toLowerCase();
        if (key === 's') { event.preventDefault(); flushChange('save'); return; }
        if (event.shiftKey && key === 'm') { event.preventDefault(); flushChange('toggleMode'); return; }
        if (key === 'k' && !event.shiftKey) { event.preventDefault(); openDialog('link'); return; }
      }
      if (!selectedImg) return;
      const tag = event.target && event.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (event.key === 'Escape') {
        event.preventDefault();
        clearImageSelection();
      } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        event.preventDefault();
        event.stopPropagation();
        moveImageBy(event.key === 'ArrowUp' ? -1 : 1);
      } else if (event.key === 'Delete' || event.key === 'Backspace') {
        event.preventDefault();
        event.stopPropagation();
        const index = imageIndex(selectedImg);
        clearImageSelection();
        if (index >= 0) {
          quill.deleteText(index, 1, 'user');
          quill.setSelection(index, 0, 'silent');
        }
      }
    }, true);

    window.hugoerSetHtml = function (html, media) {
      mergeMedia(media);
      suppress = true;
      clearTimeout(changeTimer);
      dirty = false;
      try {
        clearImageSelection();
        const delta = convertHtml(html || '', true);
        quill.setContents(delta, 'silent');
        ensureTrailingParagraph('silent');
        quill.history.clear();
      } finally {
        suppress = false;
      }
    };

    window.hugoerAddMedia = function (media) {
      mergeMedia(media);
      refreshMediaPreviews();
    };

    window.hugoerFocus = function () {
      quill.focus();
    };

    window.hugoerFlush = function () {
      flushChange('flush');
    };

    window.hugoerPasteHtml = function (html, media) {
      mergeMedia(media);
      const pending = pendingMarkdownPaste;
      pendingMarkdownPaste = null;
      if (!pending) return;
      quill.setSelection(Math.min(pending.index, quill.getLength() - 1), 0, 'silent');
      if (html) insertBlockHtml(html);
      else quill.insertText(pending.index, pending.text, 'user');
      quill.scrollSelectionIntoView();
    };

    window.hugoerCommand = function (name, argument) {
      if (name !== 'addMedia') quill.focus();
      switch (name) {
        case 'undo': quill.history.undo(); return;
        case 'redo': quill.history.redo(); return;
        case 'bold': toggleFormat('bold'); return;
        case 'italic': toggleFormat('italic'); return;
        case 'strike': toggleFormat('strike'); return;
        case 'heading': toggleFormat('header', Math.max(1, Math.min(6, parseInt(argument || '2', 10) || 2))); return;
        case 'inlineCode': toggleInlineCode(); return;
        case 'codeBlock': toggleFormat('code-block'); return;
        case 'link': openDialog('link'); return;
        case 'image': openDialog('image'); return;
        case 'quote': toggleFormat('blockquote'); return;
        case 'bulletList': toggleFormat('list', 'bullet'); return;
        case 'orderedList': toggleFormat('list', 'ordered'); return;
        case 'taskList': toggleFormat('list', 'unchecked'); return;
        case 'table':
          insertHtml('<table><tr><th>欄位一</th><th>欄位二</th></tr><tr><td>內容</td><td>內容</td></tr></table>');
          return;
        case 'hr': {
          const range = quill.getSelection(true) || { index: quill.getLength() - 1, length: 0 };
          quill.deleteText(range.index, range.length, 'user');
          quill.insertEmbed(range.index, 'divider', true, 'user');
          quill.setSelection(range.index + 1, 0, 'silent');
          return;
        }
        case 'addMedia':
          if (argument) {
            try { mergeMedia(JSON.parse(argument)); } catch {}
            refreshMediaPreviews();
          }
          return;
        case 'insertHtml':
          if (argument) insertHtml(argument);
          return;
        default:
          return;
      }
    };

    post({ type: 'ready' });
  </script>
</body>
</html>
